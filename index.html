<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수호 우주오목">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1a74">
<title>수호 대장의 우주 오목</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{
  font-family:"Jua","Apple SD Gothic Neo","AppleGothic","Nanum Gothic","Malgun Gothic",system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 120%,#ff8fb8 0%,#a45be0 35%,#3b2a9c 65%,#1a1253 100%);
  color:#2e2468;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit;color:inherit;border:none;cursor:pointer}
/* ---------- 우주 배경 ---------- */
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}
#sky span{position:absolute;opacity:.9;animation:floaty 8s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}
.screen{position:fixed;inset:0;z-index:1;display:none;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.screen.show{display:flex}

/* ---------- 공통 ---------- */
.title{margin:0;font-size:clamp(28px,5.6vw,50px);line-height:1.1;color:#fff;text-shadow:0 3px 0 #6a2fc4,0 6px 14px rgba(0,0,0,.4);text-align:center}
.sub{margin:0;font-size:clamp(16px,2.5vw,22px);color:#ffe9a8;text-shadow:0 2px 6px rgba(0,0,0,.4);text-align:center}
.ptitle{font-size:clamp(17px,2.6vw,24px);margin:4px 0 2px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.45);text-align:center}
.cbtn{background:linear-gradient(180deg,#ffd95a,#ffa91f);color:#5a2d00;font-size:clamp(22px,3.8vw,32px);padding:12px 36px;border-radius:40px;box-shadow:0 7px 0 #c9740a,0 12px 20px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.cbtn.green{background:linear-gradient(180deg,#8cf5a5,#2fd06b);color:#064d1f;box-shadow:0 7px 0 #1b9a4a,0 12px 20px rgba(0,0,0,.35)}
.cbtn.blue{background:linear-gradient(180deg,#8fd5ff,#4aa3ff);color:#06306b;box-shadow:0 7px 0 #2a6fd0,0 12px 20px rgba(0,0,0,.35)}
.cbtn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;background:rgba(255,255,255,.9);border-radius:20px;padding:8px 16px;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.25);z-index:5}

/* ---------- 홈 ---------- */
#home{flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:auto}
.porthole{position:relative;width:min(30vh,230px);height:min(30vh,230px);flex:none;margin-top:14px}
.porthole .pring{position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(#f4f6ff,#9aa8d6,#f4f6ff,#7e8cc0,#f4f6ff,#9aa8d6,#f4f6ff);box-shadow:0 0 0 5px #5b4bb0,0 0 40px rgba(255,230,120,.7),inset 0 0 12px rgba(0,0,0,.4)}
.porthole img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #2a1a74;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.porthole .glass{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 35%);pointer-events:none}
.porthole .bolt{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8e9bd0);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.porthole .rocket{position:absolute;right:-34px;top:-14px;font-size:50px;animation:fly 3s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8px,-12px) rotate(8deg)}}
.porthole .badge{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);background:linear-gradient(180deg,#ff7eb3,#ff4f8b);color:#fff;font-size:19px;padding:4px 18px;border-radius:20px;box-shadow:0 4px 0 #b52a60;white-space:nowrap}
.fromdad{background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.6);color:#fff;border-radius:18px;padding:6px 16px;font-size:clamp(15px,2.2vw,19px);text-align:center;margin-top:2px}
.homebtns{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:8px}

/* ---------- 준비 화면 ---------- */
#setup{flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:auto;padding-top:56px}
.levels{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px}
.lvl{width:clamp(130px,20vw,170px);background:#fff;border-radius:22px;padding:10px 6px 8px;box-shadow:0 5px 0 #b9a8ff,0 8px 14px rgba(0,0,0,.25);border:4px solid transparent;transition:transform .12s;text-align:center}
.lvl:active{transform:scale(.95)}
.lvl.sel{border-color:#ffb300;background:#fff9e3;transform:translateY(-3px)}
.lvl .em{font-size:clamp(38px,6vw,52px);display:block;line-height:1.1}
.lvl b{display:block;font-size:clamp(16px,2.4vw,20px);margin-top:2px}
.lvl small{display:block;font-size:13px;color:#8a82b8;margin-top:1px}
.stars{letter-spacing:2px;font-size:14px;color:#ffb300}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.opt{background:#fff;border-radius:18px;padding:8px 16px;font-size:clamp(15px,2.3vw,19px);box-shadow:0 4px 0 #b9a8ff;border:4px solid transparent;text-align:center;line-height:1.2}
.opt small{display:block;font-size:12px;color:#8a82b8}
.opt.sel{border-color:#ffb300;background:#fff9e3}

/* ---------- 레슨 목록 ---------- */
#lessons{flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:auto;padding-top:56px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;width:min(900px,100%)}
.lcard{background:#fff;border-radius:24px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 5px 0 #b9a8ff,0 8px 14px rgba(0,0,0,.25)}
.lcard:active{transform:translateY(3px)}
.lcard .ic{font-size:44px;flex:none}
.lcard b{display:block;font-size:clamp(16px,2.4vw,20px)}
.lcard small{color:#8a82b8;font-size:13px;display:block}
.lcard .st{font-size:18px;color:#ffb300;letter-spacing:1px}

/* ---------- 놀이 화면 (게임/레슨) ---------- */
#game,#lesson{padding:6px;gap:6px}
#game.show,#lesson.show{display:grid;justify-items:center;align-content:center;
  grid-template-columns:1fr}
#game.show{--bs:min(calc(100vw - 20px),calc(100dvh - 340px));
  grid-template-rows:auto auto auto auto auto;
  grid-template-areas:"opp" "board" "me" "bubble" "btns"}
#lesson.show{--bs:min(calc(100vw - 20px),calc(100dvh - 270px));
  grid-template-rows:auto auto auto auto;
  grid-template-areas:"prog" "board" "bubble" "btns"}
@media (orientation:landscape){
  #game.show{--bs:min(calc(100dvh - 26px),calc(100vw - 400px));
    grid-template-columns:var(--bs) minmax(250px,340px);
    grid-template-rows:1fr auto auto auto auto 1fr;
    grid-template-areas:"board ." "board opp" "board bubble" "board me" "board btns" "board .";
    justify-content:center;column-gap:16px;row-gap:10px}
  #lesson.show{--bs:min(calc(100dvh - 26px),calc(100vw - 400px));
    grid-template-columns:var(--bs) minmax(250px,340px);
    grid-template-rows:1fr auto auto auto 1fr;
    grid-template-areas:"board ." "board prog" "board bubble" "board btns" "board .";
    justify-content:center;column-gap:16px;row-gap:10px}
}
.card{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:22px;padding:5px 12px;box-shadow:0 4px 0 rgba(90,60,170,.55);width:min(var(--bs),100%);min-height:58px}
#oppCard{grid-area:opp}#meCard{grid-area:me}#prog{grid-area:prog}
@media (orientation:landscape){.card{width:100%}}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);object-fit:cover;background:#e9e1ff;display:flex;align-items:center;justify-content:center;font-size:30px}
#meAvatar{border-color:#ffd54f}
.who{font-size:17px;line-height:1.15;flex:none;min-width:80px}
.who small{display:block;font-size:12px;color:#8a82b8}
.cnt{flex:1;display:flex;align-items:center;gap:6px;font-size:16px;justify-content:flex-end}
.cnt svg{width:24px;height:24px}
.turnDot{width:14px;height:14px;border-radius:50%;background:#ccc;flex:none}
.card.active .turnDot{background:#4cd964;box-shadow:0 0 0 4px rgba(76,217,100,.35);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.bwrap{grid-area:board;width:var(--bs);height:var(--bs);position:relative;align-self:center;border-radius:26px;box-shadow:0 0 0 6px #7a4fd6,0 0 40px rgba(255,220,120,.45),0 14px 26px rgba(0,0,0,.45);touch-action:manipulation}
.bwrap svg.bsvg{width:100%;height:100%;display:block;border-radius:26px}
.bwrap.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.st.new{animation:drop .35s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes drop{0%{transform:scale(1.8);opacity:0}70%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
.ghost{animation:ghostp 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ghostp{50%{transform:scale(1.1);opacity:.8}}
.mk{transform-box:fill-box;transform-origin:center;animation:mkp 1s ease-in-out infinite}
@keyframes mkp{50%{transform:scale(1.18);opacity:.7}}
.winring{transform-box:fill-box;transform-origin:center;animation:mkp .7s ease-in-out infinite}
#bubble,#lbubble{background:#fff;border-radius:22px;padding:8px 14px;font-size:clamp(16px,2.3vw,20px);line-height:1.35;box-shadow:0 4px 0 rgba(90,60,170,.55);position:relative;min-height:56px;display:flex;align-items:center;gap:10px;width:min(var(--bs),100%);color:#2e2468}
#bubble{grid-area:bubble}#lbubble{grid-area:bubble}
.bem{font-size:36px;flex:none}
@media (orientation:landscape){#bubble,#lbubble{width:100%;min-height:100px}}
.btns{grid-area:btns;display:flex;gap:8px;width:min(var(--bs),100%);justify-content:center}
@media (orientation:landscape){.btns{width:100%;gap:6px;flex-wrap:wrap}.tbtn{font-size:14px;flex:1 1 30%}.btns .tbtn.go{flex:1 1 100%}}
.tbtn{flex:1;min-width:52px;background:#fff;border-radius:18px;padding:6px 4px;font-size:15px;box-shadow:0 4px 0 #b9a8ff;line-height:1.15}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9a8ff}
.tbtn span{display:block;font-size:26px}
.tbtn.hint{background:#fff3b8;box-shadow:0 4px 0 #e0c04a}
.tbtn.go{flex:2;background:linear-gradient(180deg,#8cf5a5,#2fd06b);color:#064d1f;box-shadow:0 4px 0 #1b9a4a;font-size:18px;animation:pulse 1.2s infinite}
.tbtn.off{opacity:.35;pointer-events:none}
#prog .pt{font-size:17px;flex:1}
#prog .dots{display:flex;gap:6px}
#prog .dots i{width:14px;height:14px;border-radius:50%;background:#d8d0ff;display:block}
#prog .dots i.on{background:#ffb300}
#prog .dots i.cur{box-shadow:0 0 0 3px #ff7eb3}

/* ---------- 팝업 ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(20,10,70,.62)}
.overlay.show{display:flex}
.mbox{background:#fff;border-radius:34px;padding:22px 26px 22px;text-align:center;width:min(90vw,460px);box-shadow:0 10px 0 #b9a8ff,0 20px 40px rgba(0,0,0,.4);animation:mpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes mpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.mbox .porthole{margin:30px auto 34px;width:140px;height:140px}
.mbox h2{margin:6px 0;font-size:32px;color:#6a2fc4}
.mbox p{margin:4px 0 14px;font-size:19px;line-height:1.35}
.mbox .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mbtn{background:linear-gradient(180deg,#ffd95a,#ffa91f);color:#5a2d00;font-size:20px;padding:10px 20px;border-radius:30px;box-shadow:0 5px 0 #c9740a}
.mbtn.b{background:linear-gradient(180deg,#8fd5ff,#4aa3ff);color:#06306b;box-shadow:0 5px 0 #2a6fd0}
.mbtn.g{background:linear-gradient(180deg,#8cf5a5,#2fd06b);color:#064d1f;box-shadow:0 5px 0 #1b9a4a}
.mbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.wbox{background:#fff;border-radius:30px;padding:18px 22px;width:min(90vw,420px);text-align:center;box-shadow:0 10px 0 #ffb300,0 20px 40px rgba(0,0,0,.4);animation:mpop .4s cubic-bezier(.2,1.6,.4,1)}
.wbox .big{font-size:64px;line-height:1}
.wbox h3{margin:6px 0;font-size:28px;color:#e8590c}
.wbox p{margin:4px 0 12px;font-size:19px;line-height:1.35}
#warn{background:rgba(20,10,70,.18);align-items:flex-end;padding-bottom:14px}
#warn .wbox{padding:12px 16px;width:min(94vw,520px)}
#warn .wbox .big{font-size:44px}
#warn .wbox h3{font-size:24px;margin:2px 0}
#warn .wbox p{font-size:18px;margin:2px 0 8px}
@media (orientation:landscape){#warn{align-items:center;justify-content:flex-end;padding-right:12px}#warn .wbox{width:340px}}
input{-webkit-user-select:text;user-select:text}
.cbtn.green{background:linear-gradient(180deg,#8cf5a5,#2fd06b);color:#064d1f;box-shadow:0 7px 0 #1b9a4a,0 12px 20px rgba(0,0,0,.35)}
.nameinp{font-family:inherit;font-size:24px;padding:10px 16px;border-radius:18px;border:4px solid #b9a8ff;width:min(320px,80vw);text-align:center;color:#2e2468;outline:none;background:#fff}
.nameinp:focus{border-color:#ffb300}
.avs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:520px}
.avb{font-size:34px;background:#fff;border-radius:50%;width:56px;height:56px;border:4px solid transparent;box-shadow:0 3px 0 #b9a8ff;padding:0}
.avb.sel{border-color:#ffb300;background:#fff9e3;transform:scale(1.1)}
#game.friend #hintBtn{display:none}
.porthole .femoji{position:absolute;inset:0;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:72px;background:#fff3c4;border:5px solid #2a1a74}
.pbar{position:absolute;transform:translate(-50%,-50%);display:flex;gap:6px;z-index:6;animation:pbpop .25s cubic-bezier(.2,1.6,.4,1)}
@keyframes pbpop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.pbtn{font-family:inherit;border:none;border-radius:999px;font-size:clamp(17px,calc(var(--bs)*.04),26px);padding:.45em .9em;box-shadow:0 4px 0 rgba(0,0,0,.3),0 6px 14px rgba(0,0,0,.3);white-space:nowrap}
.pbtn.ok{background:linear-gradient(180deg,#8cf5a5,#2fd06b);color:#064d1f;box-shadow:0 4px 0 #1b9a4a,0 6px 14px rgba(0,0,0,.3)}
.pbtn.no{background:#fff;color:#c0392b;padding:.45em .7em}
.pbtn:active{transform:translateY(3px)}
#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="gSun" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fffbd0"/><stop offset=".45" stop-color="#ffd93b"/><stop offset="1" stop-color="#f59f00"/></radialGradient>
  <radialGradient id="gMoon" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#c3b5ff"/><stop offset=".5" stop-color="#6a4fd1"/><stop offset="1" stop-color="#2a1a74"/></radialGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2c9"/><stop offset="1" stop-color="#ffd98a"/></linearGradient>
</defs></svg>
<div id="sky"></div>

<script>
"use strict";
/* =====================================================
   수호 대장의 우주 오목 - 아빠가 수호를 위해 만든 오목 게임
   (한 파일, 인터넷 없이도 동작)
   ===================================================== */
const $=id=>document.getElementById(id);
const U=100, M=70;
const WOF=n=>2*M+(n-1)*U;

/* ---------- 설정 저장 ---------- */
const KEY='suhoOmok';
let cfg={level:1,size:9,first:true,helper:true,sound:true,les:{},mode:'cpu',friendName:'',friendAvatar:'🦊'};
try{const sv=JSON.parse(localStorage.getItem(KEY)||'null'); if(sv) Object.assign(cfg,sv);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg));}catch(e){}}
let soundOn=cfg.sound!==false;

/* ---------- 우주 배경 ---------- */
(function(){
  let h='';
  for(let i=0;i<70;i++) h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*3}s;opacity:${.3+Math.random()*.7}"></i>`;
  const e=['🪐','🌙','🚀','🛸','☄️','🌍','⭐','👽'];
  for(let i=0;i<8;i++) h+=`<span style="left:${Math.random()*92}%;top:${Math.random()*88}%;font-size:${26+Math.random()*30}px;animation-delay:${-Math.random()*8}s;animation-duration:${6+Math.random()*5}s">${e[i]}</span>`;
  $('sky').innerHTML=h;
})();

/* ---------- 소리 ---------- */
let AC=null;
function ensureAudio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); }
function tone(f,d,type,v,delay,f2){
  if(!soundOn||!AC) return;
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v||.2,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
}
const SFX={
  put(){tone(520,.12,'triangle',.3,0,260);},
  put2(){tone(400,.12,'triangle',.28,0,200);},
  select(){tone(760,.07,'sine',.18);},
  good(){[660,880,1100].forEach((f,i)=>tone(f,.15,'triangle',.22,i*.09));},
  oops(){tone(220,.18,'sawtooth',.1,0,150);},
  warn(){tone(880,.12,'square',.12);tone(660,.2,'square',.12,.14);},
  win(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.22,'triangle',.25,i*.14));},
  lose(){[392,349,330,294].forEach((f,i)=>tone(f,.28,'sine',.22,i*.2));}
};

/* ---------- 귀여운 돌 (해님 / 달님) ---------- */
function stoneInner(who){
  if(who===1) return `<circle r="43" fill="url(#gSun)" stroke="#b36b00" stroke-width="4"/>
   <circle cx="-14" cy="-6" r="5.5" fill="#4a2a05"/><circle cx="14" cy="-6" r="5.5" fill="#4a2a05"/>
   <circle cx="-12.2" cy="-8" r="1.9" fill="#fff"/><circle cx="15.8" cy="-8" r="1.9" fill="#fff"/>
   <ellipse cx="-25" cy="8" rx="7" ry="4.5" fill="#ff8fab" opacity=".85"/><ellipse cx="25" cy="8" rx="7" ry="4.5" fill="#ff8fab" opacity=".85"/>
   <path d="M-9 10 Q0 22 9 10" fill="none" stroke="#4a2a05" stroke-width="4" stroke-linecap="round"/>`;
  return `<circle r="43" fill="url(#gMoon)" stroke="#170d52" stroke-width="4"/>
   <circle cx="-14" cy="-6" r="6.5" fill="#fff"/><circle cx="14" cy="-6" r="6.5" fill="#fff"/>
   <circle cx="-13" cy="-5" r="3.2" fill="#1b1060"/><circle cx="15" cy="-5" r="3.2" fill="#1b1060"/>
   <ellipse cx="-25" cy="8" rx="6" ry="4" fill="#ff9ec7" opacity=".6"/><ellipse cx="25" cy="8" rx="6" ry="4" fill="#ff9ec7" opacity=".6"/>
   <path d="M-8 11 Q0 19 8 11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>`;
}
document.body.insertAdjacentHTML('afterbegin',`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="stoneSunIcon">${stoneInner(1)}</g><g id="stoneMoonIcon">${stoneInner(2)}</g></defs></svg>`);

/* ---------- 판 그리기 (SVG) ---------- */
function hoshi(n){return n===9?[2,4,6]:n===13?[3,6,9]:[3,7,11];}
function boardSVG(n,b,o){
  o=o||{}; const W=WOF(n), P=i=>M+i*U;
  let s=`<svg class="bsvg" viewBox="0 0 ${W} ${W}" preserveAspectRatio="xMidYMid meet">`;
  s+=`<rect width="${W}" height="${W}" rx="46" fill="url(#gBoard)"/><rect x="14" y="14" width="${W-28}" height="${W-28}" rx="34" fill="none" stroke="rgba(160,110,40,.35)" stroke-width="5"/>`;
  s+=`<g stroke="#a1713c" stroke-width="4" stroke-linecap="round">`;
  for(let i=0;i<n;i++) s+=`<line x1="${M}" y1="${P(i)}" x2="${P(n-1)}" y2="${P(i)}"/><line x1="${P(i)}" y1="${M}" x2="${P(i)}" y2="${P(n-1)}"/>`;
  s+=`</g>`;
  const hs=hoshi(n); const pts=n===9?[[2,2],[2,6],[6,2],[6,6],[4,4]]:hs.flatMap(a=>hs.map(c=>[a,c]));
  pts.forEach(([r,c])=>{s+=`<circle cx="${P(c)}" cy="${P(r)}" r="9" fill="#a1713c"/>`;});
  (o.bars||[]).forEach(bar=>{s+=`<line x1="${P(bar.from[1])}" y1="${P(bar.from[0])}" x2="${P(bar.to[1])}" y2="${P(bar.to[0])}" stroke="rgba(255,150,0,.5)" stroke-width="70" stroke-linecap="round"/>`;});
  const lm=o.last;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const v=b[r*n+c]; if(!v) continue;
    const isNew=lm&&lm.r===r&&lm.c===c;
    s+=`<g transform="translate(${P(c)},${P(r)})"><g class="st${isNew?' new':''}">${stoneInner(v)}${isNew?`<circle cx="30" cy="-30" r="11" fill="#ff4f6d" stroke="#fff" stroke-width="4"/>`:''}</g></g>`;
  }
  (o.win||[]).forEach(([r,c])=>{s+=`<g transform="translate(${P(c)},${P(r)})"><circle class="winring" r="50" fill="none" stroke="#ff2f92" stroke-width="9"/></g>`;});
  if(o.ghost){const g=o.ghost; s+=`<g transform="translate(${P(g.c)},${P(g.r)})"><g class="ghost" opacity=".7">${stoneInner(g.who)}</g><circle r="52" fill="none" stroke="#2fd06b" stroke-width="7" stroke-dasharray="14 10"/></g>`;}
  (o.marks||[]).forEach(m=>{
    const x=P(m.c),y=P(m.r);
    if(m.k==='ring') s+=`<g transform="translate(${x},${y})"><circle class="mk" r="40" fill="rgba(255,235,59,.25)" stroke="#ffb300" stroke-width="9"/></g>`;
    else if(m.k==='danger') s+=`<g transform="translate(${x},${y})"><g class="mk"><circle r="42" fill="rgba(255,50,50,.3)" stroke="#ff2b2b" stroke-width="8"/><text y="16" text-anchor="middle" font-size="52" font-weight="900" fill="#ff2b2b">!</text></g></g>`;
    else if(m.k==='warn') s+=`<g transform="translate(${x},${y})"><g class="mk"><circle r="42" fill="rgba(255,150,0,.3)" stroke="#ff8a00" stroke-width="8"/><text y="16" text-anchor="middle" font-size="52" font-weight="900" fill="#ff8a00">!</text></g></g>`;
    else if(m.k==='star') s+=`<g transform="translate(${x},${y})"><g class="mk"><circle r="42" fill="rgba(255,235,59,.35)" stroke="#ffb300" stroke-width="7"/><text y="20" text-anchor="middle" font-size="56">⭐</text></g></g>`;
  });
  return s+'</svg>';
}
/* 터치로 교차점 찾기 */
function bindBoard(container,getN,cb){
  container.addEventListener('pointerdown',e=>{
    if(e.target.closest&&e.target.closest('.pbar')) return;
    const svg=container.querySelector('svg'); if(!svg) return;
    e.preventDefault();
    const n=getN(), W=WOF(n), rect=svg.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*W, y=(e.clientY-rect.top)/rect.height*W;
    const c=Math.round((x-M)/U), r=Math.round((y-M)/U);
    if(r<0||c<0||r>=n||c>=n) return;
    cb(r,c);
  });
}

/* ---------- 오목 규칙 / 모양 읽기 ---------- */
const DIRS=[[0,1],[1,0],[1,1],[1,-1]];
function lineStr(b,n,r,c,dr,dc,who){
  let s='';
  for(let k=-4;k<=4;k++){
    if(k===0){s+='x';continue;}
    const rr=r+dr*k, cc=c+dc*k;
    if(rr<0||cc<0||rr>=n||cc>=n){s+='o';continue;}
    const v=b[rr*n+cc]; s+= v===0?'_':(v===who?'x':'o');
  }
  return s;
}
function fourComps(t,j){ // t 문자열에서 4개+빈칸1 인 5칸 창의 빈칸 위치 집합 (j가 있으면 j를 포함하는 창만)
  const set=new Set();
  for(let i=0;i<=4;i++){
    if(j!==undefined&&!(i<=j&&j<i+5)) continue;
    let x=0,e=-1,bad=false;
    for(let k=0;k<5;k++){const ch=t[i+k]; if(ch==='x')x++; else if(ch==='_')e=i+k; else bad=true;}
    if(!bad&&x===4&&e>=0) set.add(e);
  }
  return set;
}
function classify(s){
  let L=0,R=0; for(let i=3;i>=0&&s[i]==='x';i--)L++; for(let i=5;i<9&&s[i]==='x';i++)R++;
  if(L+R+1>=5) return {t:'five'};
  const comps=fourComps(s);
  if(comps.size>=2) return {t:'o4'};
  if(comps.size===1) return {t:'c4'};
  for(let j=0;j<9;j++){
    if(s[j]!=='_') continue;
    const t=s.slice(0,j)+'x'+s.slice(j+1);
    if(fourComps(t,j).size>=2) return {t:'o3'};
  }
  let base=0;
  for(let i=0;i<=4;i++){const w=s.substr(i,5); if(w.includes('o'))continue; let x=0; for(const ch of w) if(ch==='x')x++; if(x===2)base+=6; else if(x===3)base+=30;}
  return {t:'none',base};
}
function evalPlace(b,n,r,c,who,combo){
  if(combo===undefined) combo=true;
  let five=0,o4=0,f=0,t=0,base=0;
  for(const [dr,dc] of DIRS){
    const cl=classify(lineStr(b,n,r,c,dr,dc,who));
    if(cl.t==='five')five++; else if(cl.t==='o4')o4++; else if(cl.t==='c4')f++; else if(cl.t==='o3')t++; else base+=cl.base;
  }
  let score;
  if(five) score=1e7;
  else if(!combo) score=base+(f+o4)*3000+t*1500;
  else if(o4||f>=2) score=1e6+base;
  else if(f>=1&&t>=1) score=3e5+base;
  else if(t>=2) score=1e5+base;
  else score=f*1e4+t*4e3+base;
  return {five:five>0,o4:o4>0,f,t,score,unstoppable:!five&&(o4>0||f>=2||(f>=1&&t>=1)),fork:t>=2};
}
function findLine(b,n,r,c,who){
  for(const [dr,dc] of DIRS){
    const cells=[[r,c]];
    for(let k=1;;k++){const rr=r+dr*k,cc=c+dc*k; if(rr<0||cc<0||rr>=n||cc>=n||b[rr*n+cc]!==who)break; cells.push([rr,cc]);}
    for(let k=1;;k++){const rr=r-dr*k,cc=c-dc*k; if(rr<0||cc<0||rr>=n||cc>=n||b[rr*n+cc]!==who)break; cells.push([rr,cc]);}
    if(cells.length>=5) return cells;
  }
  return null;
}
function emptyCells(b,n){const a=[]; for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(!b[r*n+c]) a.push([r,c]); return a;}
function candCells(b,n,rad){
  const out=[], seen=new Set();
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(!b[r*n+c]) continue;
    for(let dr=-rad;dr<=rad;dr++)for(let dc=-rad;dc<=rad;dc++){
      const rr=r+dr,cc=c+dc; if(rr<0||cc<0||rr>=n||cc>=n||b[rr*n+cc]) continue;
      const k=rr*n+cc; if(seen.has(k)) continue; seen.add(k); out.push([rr,cc]);
    }
  }
  return out;
}

/* ---------- 컴퓨터 친구들 ---------- */
const LEVELS=[
  {id:0,em:'👽',name:'꼬마 외계인',desc:'아주 쉬워요',stars:'★',    pWin:.5,pBlock:.3,rand:.55,A:1,  D:.6, noise:1.6,combo:false,look:false},
  {id:1,em:'🤖',name:'로봇 친구',  desc:'쉬워요',      stars:'★★',   pWin:.9,pBlock:.7,rand:.2, A:1,  D:.8, noise:.8, combo:false,look:false},
  {id:2,em:'🐙',name:'문어 박사',  desc:'보통이에요',  stars:'★★★',  pWin:1, pBlock:1, rand:.05,A:1,  D:.95,noise:.35,combo:true, look:false},
  {id:3,em:'🐉',name:'우주 용',    desc:'어려워요',    stars:'★★★★', pWin:1, pBlock:1, rand:0,  A:1.1,D:1,  noise:.04,combo:true, look:true}
];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function aiMove(b,n,lv){
  const L=LEVELS[lv]; let stones=0; for(const v of b) if(v) stones++;
  const mid=n>>1;
  if(stones===0){ const o=lv===0?pick([-1,0,1]):0; return [mid+o,mid]; }
  let cs=candCells(b,n,2);
  const info=cs.map(([r,c])=>({r,c,att:evalPlace(b,n,r,c,2,L.combo),def:evalPlace(b,n,r,c,1,L.combo)}));
  const wins=info.filter(x=>x.att.five);
  if(wins.length&&Math.random()<L.pWin){ const w=pick(wins); return [w.r,w.c]; }
  const blocks=info.filter(x=>x.def.five);
  if(blocks.length&&Math.random()<L.pBlock){ blocks.sort((x,y)=>y.att.score-x.att.score); return [blocks[0].r,blocks[0].c]; }
  if(Math.random()<L.rand){ const near=candCells(b,n,1); const m=pick(near); return m; }
  info.forEach(x=>{
    let s=x.att.score*L.A+x.def.score*L.D;
    s*=1+(Math.random()-.5)*L.noise;
    s+=Math.random()*20-(Math.abs(x.r-mid)+Math.abs(x.c-mid))*2;
    x.s=s;
  });
  info.sort((x,y)=>y.s-x.s);
  if(L.look){
    for(const x of info.slice(0,6)){
      if(x.att.five){x.s2=1e9;continue;}
      b[x.r*n+x.c]=2;
      let mx=0; for(const [r,c] of candCells(b,n,2)){const e=evalPlace(b,n,r,c,1,true); if(e.score>mx)mx=e.score;}
      b[x.r*n+x.c]=0;
      x.s2=x.s-0.4*mx;
    }
    const top=info.slice(0,6); top.sort((x,y)=>y.s2-x.s2); return [top[0].r,top[0].c];
  }
  return [info[0].r,info[0].c];
}
function suggest(b,n,who){
  const opp=3-who; const mid=n>>1;
  let stones=0; for(const v of b) if(v) stones++;
  if(stones===0) return {r:mid,c:mid,reason:'build'};
  const info=candCells(b,n,2).map(([r,c])=>({r,c,att:evalPlace(b,n,r,c,who),def:evalPlace(b,n,r,c,opp)}));
  info.forEach(x=>x.s=x.att.score*1.05+x.def.score+Math.random()-(Math.abs(x.r-mid)+Math.abs(x.c-mid)));
  info.sort((x,y)=>y.s-x.s);
  const x=info[0];
  let reason='build';
  if(x.att.five) reason='win'; else if(x.def.five) reason='block'; else if(x.att.unstoppable) reason='fork';
  else if(x.def.unstoppable) reason='blockfork'; else if(x.att.t>=1) reason='three'; else if(x.def.t>=1||x.def.f>=1) reason='defend';
  return {r:x.r,c:x.c,reason};
}

function startConfetti(){
  const cv=$('confetti'),ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#ff5fa2','#ffd54f','#4dd0e1','#9575ff','#69f0ae','#ff8a65'];
  const ps=Array.from({length:130},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,w:8+Math.random()*8,h:12+Math.random()*10,c:cols[Math.floor(Math.random()*cols.length)],vy:2+Math.random()*4,vx:(Math.random()-.5)*3,r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function loop(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; if(p.y>cv.height&&t-t0<5000){p.y=-20;p.x=Math.random()*cv.width;}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(t-t0<8000) confettiRAF=requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

function checkMove(r,c){
  const n=G.n,b=G.b;
  const me=evalPlace(b,n,r,c,1);
  if(me.five) return null;
  const myWins=emptyCells(b,n).filter(([rr,cc])=>evalPlace(b,n,rr,cc,1).five);
  if(myWins.length) return {type:'win',cells:myWins};
  b[r*n+c]=1;
  let res=null;
  const oppWins=emptyCells(b,n).filter(([rr,cc])=>evalPlace(b,n,rr,cc,2).five);
  if(oppWins.length) res={type:'block',cells:oppWins};
  else if(!(me.f>=1||me.o4)){
    const strong=candCells(b,n,2).filter(([rr,cc])=>evalPlace(b,n,rr,cc,2).unstoppable);
    if(strong.length) res={type:'danger',cells:strong};
  }
  b[r*n+c]=0;
  return res;
}
function confirmMove(){
  if(!G.pending) return;
  const {r,c,who}=G.pending;
  if(G.mode==='friend'||!cfg.helper){ placeStone(who,r,c); return; }
  const w=checkMove(r,c);
  if(!w){ placeStone(1,r,c); return; }
  SFX.warn();
  const kind=w.type==='win'?'star':w.type==='block'?'danger':'warn';
  G.marks=w.cells.map(([rr,cc])=>({r:rr,c:cc,k:kind}));
  renderGame();
  $('wem').textContent=w.type==='win'?'⭐':'🛑';
  $('wtitle').textContent='잠깐! 🤔';
  $('wtext').textContent=w.type==='win'?'지금 5개를 만들 수 있는 곳이 있어요! 반짝이는 별을 봐요. 그곳에 놓으면 이겨요!'
    :w.type==='block'?'상대가 빨간 곳에 두면 5개가 돼서 져요! 먼저 막아야 해요.'
    :'상대가 주황색 곳에 두면 막기 힘든 모양이 돼요. 한 번 더 생각해볼까요?';
  $('warn').classList.add('show');
}
$('wRethink').onclick=()=>{$('warn').classList.remove('show'); G.pending=null; renderGame(); gsay('🦉','좋아요! 다시 잘 살펴봐요. 힌트 버튼도 있어요 💡');};
$('wGo').onclick=()=>{$('warn').classList.remove('show'); if(G.pending){const {r,c}=G.pending; placeStone(1,r,c);}};
function placeStone(who,r,c){
  const n=G.n; G.b[r*n+c]=who; G.moves.push({r,c,who}); G.pending=null; G.marks=[];
  who===1?SFX.put():SFX.put2();
  const line=findLine(G.b,n,r,c,who);
  if(line){ G.win=line; G.over=true; renderGame(); finishGame(who===1?'win':'lose',who); return; }
  if(!G.b.includes(0)){ G.over=true; renderGame(); finishGame('draw'); return; }
  G.turn=3-who; renderGame();
  if(G.mode==='friend'){ gsay(G.turn===1?'🌞':'🌙',`${stoneName(G.turn)} 차례예요! 어디에 놓을까요?`); return; }
  if(G.turn===2) computerTurn(); else afterComputer();
}
function computerTurn(){
  G.thinking=true; renderGame();
  gsay(LEVELS[cfg.level].em,'음... 어디에 놓을까?');
  setTimeout(()=>{
    if(!G||G.over||G.mode!=='cpu'){return;}
    const mv=aiMove(G.b,G.n,cfg.level);
    G.thinking=false;
    placeStone(2,mv[0],mv[1]);
  },650+Math.random()*600);
}
function afterComputer(){
  const n=G.n,b=G.b;
  if(!cfg.helper){ gsay('🦉','수호 대장님 차례예요!'); return; }
  const cells=emptyCells(b,n);
  const myWin=cells.some(([r,c])=>evalPlace(b,n,r,c,1).five);
  const oppFive=cells.some(([r,c])=>evalPlace(b,n,r,c,2).five);
  if(myWin) gsay('⭐','와! 5개를 만들 수 있는 곳이 있어요. 찾아봐요!');
  else if(oppFive) gsay('😮','조심조심! 상대 돌이 4개예요. 5개가 되기 전에 막아야 해요! 🛡️');
  else if(candCells(b,n,2).some(([r,c])=>evalPlace(b,n,r,c,2).unstoppable)) gsay('🚦','상대가 열린 3 같아요! 지금 막으면 좋아요. 양쪽 끝을 살펴봐요.');
  else { const t=TIPS[G.tip++%TIPS.length]; gsay(t[0],t[1]); }
}
function finishGame(res,who){
  const L=LEVELS[cfg.level];
  const again={label:'🔄 한 판 더!',cls:'',fn:newGame}, home={label:'🏠 처음으로',cls:'b',fn:()=>show('home')};
  if(G.mode==='friend'){
    if(res==='draw'){
      gsay('🤝','판이 가득 찼어요. 무승부!');
      setTimeout(()=>showModal({title:'비겼어요! 🤝',text:'판이 가득 찼어요. 둘 다 정말 잘했어요!',icon:'🤝',buttons:[again,home]}),700);
      return;
    }
    const nm=stoneName(who);
    SFX.win(); gsay('🏆',`5개 완성! ${nm} 승리!`); setTimeout(startConfetti,200);
    setTimeout(()=>showModal({title:`${nm} 최고! 🎉`,text:`5개를 먼저 이었어요! 둘 다 정말 잘했어요!`,icon:'🏆',emoji:who===1?null:cfg.friendAvatar,buttons:[again,home]}),1100);
    return;
  }
  if(res==='win'){
    SFX.win(); gsay('🏆','5개 완성! 수호 대장 승리!'); setTimeout(startConfetti,200);
    setTimeout(()=>showModal({title:'수호 대장 최고! 🎉',text:`5개를 먼저 이었어요! ${L.name}를 이겼어요!`,icon:'🏆',buttons:[again,home]}),1100);
  } else if(res==='lose'){
    SFX.lose(); gsay('🤗','괜찮아요! 다음엔 이길 수 있어요.');
    setTimeout(()=>showModal({title:'괜찮아, 수호 대장! 💪',text:'상대 줄을 한 번만 더 막아 보자! 레슨에서 같이 연습할까요?',icon:'🌈',
      buttons:[{label:'🔄 한 판 더',cls:'',fn:newGame},{label:'📚 레슨 가기',cls:'g',fn:()=>{buildLessons();show('lessons');}},{label:'🏠 처음',cls:'b',fn:()=>show('home')}]}),1100);
  } else {
    gsay('🤝','판이 가득 찼어요. 무승부!');
    setTimeout(()=>showModal({title:'비겼어요! 🤝',text:'판이 가득 찼어요. 정말 잘 막았어요!',icon:'🤝',
      buttons:[{label:'🔄 한 판 더',cls:'',fn:newGame},{label:'🏠 처음',cls:'b',fn:()=>show('home')}]}),700);
  }
}
$('hintBtn').onclick=()=>{
  if(!G||G.mode==='friend'||G.over||G.thinking||G.turn!==1) return;
  ensureAudio(); const s=suggest(G.b,G.n,1);
  G.pending=null; G.marks=[{r:s.r,c:s.c,k:'star'}]; SFX.good(); renderGame();
  gsay('💡',REASON[s.reason]);
};
$('undoBtn').onclick=()=>{
  if(!G||G.thinking||G.moves.length===0) return;
  if(G.mode==='friend'){
    const mv=G.moves.pop();
    G.b.fill(0); G.moves.forEach(m=>G.b[m.r*G.n+m.c]=m.who);
    G.turn=mv.who; G.pending=null; G.marks=[]; G.win=null; G.over=false; hideModal(); SFX.select(); renderGame();
    gsay('↩️',`한 수 물렀어요! ${stoneName(G.turn)} 차례예요.`);
    return;
  }
  if(G.over) return;
  let k=-1; for(let i=G.moves.length-1;i>=0;i--) if(G.moves[i].who===1){k=i;break;}
  if(k<0) return;
  G.moves=G.moves.slice(0,k);
  G.b.fill(0); G.moves.forEach(m=>G.b[m.r*G.n+m.c]=m.who);
  G.turn=1; G.pending=null; G.marks=[]; G.win=null; SFX.select(); renderGame();
  gsay('↩️','괜찮아요! 다시 생각해서 놓아봐요.');
};

let LS=null;
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n);}
function buildLessons(){
  $('lgrid').innerHTML=LESSONS.map((l,i)=>{const s=cfg.les[l.id]||0; return `<button class="lcard" data-i="${i}"><span class="ic">${l.icon}</span><span><b>${i+1}. ${l.title}</b><small>${l.desc}</small><span class="st">${s?stars(s):'☆☆☆'}</span></span></button>`;}).join('');
  document.querySelectorAll('.lcard').forEach(b=>b.onclick=()=>{ensureAudio();SFX.select();startLesson(+b.dataset.i);});
}
function startLesson(i){
  LS={i,les:LESSONS[i],step:0,errors:0,timers:[]};
  show('lesson'); loadStep();
}
function lsay(em,t){$('lbem').textContent=em;$('lbtxt').textContent=t;}
function clearTimers(){if(LS)LS.timers.forEach(clearTimeout); if(LS)LS.timers=[];}
function loadStep(){
  clearTimers();
  const n=9, st=LS.les.steps[LS.step];
  LS.b=new Array(n*n).fill(0); (st.stones||[]).forEach(([r,c,w])=>LS.b[r*n+c]=w);
  LS.marks=(st.marks||[]).map(([r,c,k])=>({r,c,k}));
  LS.bars=(st.bars||[]).map(([a,b])=>({from:a,to:b}));
  LS.win=null; LS.wrong=0; LS.solved=st.t==='say'; LS.last=null;
  $('ltitle').textContent=`${LS.i+1}. ${LS.les.title}`;
  $('ldots').innerHTML=LS.les.steps.map((s,i)=>`<i class="${i<LS.step?'on':''} ${i===LS.step?'cur':''}"></i>`).join('');
  lsay(st.t==='say'?'🦉':'🤔',st.text);
  renderLesson();
}
function renderLesson(){
  const st=LS.les.steps[LS.step];
  $('lboard').innerHTML=boardSVG(9,LS.b,{marks:LS.marks,bars:LS.bars,win:LS.win,last:LS.last});
  const last=LS.step===LS.les.steps.length-1;
  $('lNext').textContent=last?'끝! 🎓':'다음 ▶';
  $('lNext').classList.toggle('off',!LS.solved);
  $('lPrev').classList.toggle('off',LS.step===0);
  $('lHint').classList.toggle('off',st.t!=='puzzle'||LS.solved);
}
bindBoard($('lboard'),()=>9,(r,c)=>onTapLesson(r,c));
function onTapLesson(r,c){
  if(!LS) return; ensureAudio();
  const st=LS.les.steps[LS.step];
  if(st.t!=='puzzle'||LS.solved) return;
  if(LS.b[r*9+c]){ SFX.oops(); shakeBoard($('lboard')); lsay('🦉','거기에는 이미 돌이 있어요. 빈 곳을 눌러봐요!'); return; }
  let good;
  if(st.accept) good=st.accept.some(a=>a[0]===r&&a[1]===c);
  else if(st.cellOk) good=st.cellOk(r,c);
  else good=st.fn(evalPlace(LS.b,9,r,c,1));
  if(good){
    LS.b[r*9+c]=1; LS.last={r,c}; LS.marks=[]; LS.solved=true; SFX.put();
    const line=findLine(LS.b,9,r,c,1); if(line) LS.win=line;
    renderLesson(); SFX.good(); lsay('🎉',st.ok||'정답이에요! 잘했어요!');
    if(line) setTimeout(startConfetti,150);
    if(st.demo){
      let d=1600;
      st.demo.forEach(([rr,cc,w])=>{LS.timers.push(setTimeout(()=>{LS.b[rr*9+cc]=w; LS.last={r:rr,c:cc}; w===1?SFX.put():SFX.put2(); renderLesson();},d)); d+=1300;});
      LS.timers.push(setTimeout(()=>{LS.marks=(st.demoMarks||[]).map(([rr,cc])=>({r:rr,c:cc,k:'star'})); renderLesson(); lsay('🦉',st.demoText); SFX.good();},d));
    }
  } else {
    LS.errors++; LS.wrong++; SFX.oops(); shakeBoard($('lboard'));
    const msg=(st.wrongMap&&st.wrongMap[r+','+c])||st.wrong||'음, 다시 한번 생각해봐요! 💡 힌트 버튼을 눌러도 돼요.';
    lsay('🦉',msg);
    if(LS.wrong>=2) showLessonHint(st);
  }
}
function showLessonHint(st){
  const cells=st.hintCells||st.accept||[];
  LS.marks=cells.slice(0,1).map(([r,c])=>({r,c,k:'star'}));
  renderLesson();
}
$('lHint').onclick=()=>{
  if(!LS) return; const st=LS.les.steps[LS.step]; if(st.t!=='puzzle'||LS.solved) return;
  SFX.good(); LS.errors+=0.5; showLessonHint(st); lsay('💡',st.hint||'별이 있는 곳을 봐요!');
};
$('lPrev').onclick=()=>{ if(LS&&LS.step>0){LS.step--; SFX.select(); loadStep();} };
$('lNext').onclick=()=>{
  if(!LS) return; if(!LS.solved){ lsay('🦉','먼저 문제를 풀어봐요! 어려우면 힌트 버튼을 눌러요 💡'); return; }
  stopConfetti();
  if(LS.step<LS.les.steps.length-1){ LS.step++; SFX.select(); loadStep(); return; }
  // 레슨 끝
  const s=LS.errors<=0.5?3:LS.errors<=3?2:1;
  cfg.les[LS.les.id]=Math.max(cfg.les[LS.les.id]||0,s); save();
  SFX.win(); setTimeout(startConfetti,200);
  const hasNext=LS.i<LESSONS.length-1, ni=LS.i+1;
  showModal({title:s===3?'완벽해요! 🎉':'잘했어요! 🌟',text:`"${LS.les.title}" 레슨 끝!  ${stars(s)}`,icon:'🎓',
    buttons:[hasNext?{label:'➡ 다음 레슨',cls:'g',fn:()=>startLesson(ni)}:{label:'🎮 게임하러 가기',cls:'g',fn:()=>{buildSetup();show('setup');}},
             {label:'📚 목록',cls:'b',fn:()=>{buildLessons();show('lessons');}},{label:'🔁 다시',cls:'',fn:()=>startLesson(LS.i)}]});
};
$('lHome').onclick=()=>{clearTimers();stopConfetti();buildLessons();show('lessons');};
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
